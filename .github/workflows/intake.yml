name: intake

# The firm ingesting work orders from the client. An Issue opened on this
# repository is an order; the pipeline runs against it and replies in the
# thread. That makes the channel real rather than described.
#
# The issue body is DATA. The fenced JSON block is parsed and validated against
# the WorkOrder contract; prose outside the fence is never interpreted, so an
# order that opens with "ignore previous instructions" is just an order with a
# strange first line.

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: intake-${{ github.event.issue.number }}

jobs:
  fulfil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - run: uv sync

      - name: Parse the order out of the issue body
        id: order
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          uv run python - <<'PY'
          import json, os, pathlib, re, sys

          body = os.environ.get("BODY") or ""
          m = re.search(r"```json\s*(.*?)```", body, re.S)
          if not m:
              print("no fenced json order in the issue body", file=sys.stderr)
              pathlib.Path("order.json").write_text("null")
              sys.exit(0)
          try:
              order = json.loads(m.group(1))
          except json.JSONDecodeError as exc:
              print(f"order fence is not valid json: {exc.msg}", file=sys.stderr)
              pathlib.Path("order.json").write_text("null")
              sys.exit(0)
          pathlib.Path("order.json").write_text(json.dumps(order))
          print(f"parsed order {order.get('id', '?')}")
          PY

      - name: Run the pipeline against it
        env:
          TERAC_API_KEY: ${{ secrets.TERAC_API_KEY }}
          # Optional by design. Unset, the draft falls back to the recorded
          # fixture and the run says so on the deliverable and the page -- so a
          # missing model key degrades the answer, never the pipeline.
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_API_BASE: ${{ secrets.MODEL_API_BASE }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
        run: |
          uv run python - <<'PY'
          import json, pathlib
          from company.harness import run_pipeline
          from company.stages import PIPELINE, initial_state

          raw = json.loads(pathlib.Path("order.json").read_text())
          state = initial_state()
          if raw:
              state["order"] = raw
          result = run_pipeline(
              PIPELINE, run_id="issue-${{ github.event.issue.number }}", initial_state=state
          )
          # Every artifact comes from whichever stage produced it. The logs are
          # cumulative so the last record carries all of them; the artifacts are
          # not, and reading them off the last record is what once reported a
          # fulfilled order as "rejected at intake".
          last = result.records[-1]["output"] if result.records else {}
          pathlib.Path("reply.md").write_text(
              json.dumps(
                  {
                      "ok": result.ok,
                      "error": result.error,
                      "deliverable": result.emitted("deliverable"),
                      "product": result.emitted("product"),
                      "offer": result.emitted("offer"),
                      "decisions": last.get("decisions", []),
                      "incidents": last.get("incidents", []),
                  },
                  indent=2,
              )
          )
          PY

      - name: Reply in the thread
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python - <<'PY'
          import json, os, pathlib, urllib.request

          r = json.loads(pathlib.Path("reply.md").read_text())
          d = r.get("deliverable") or {}
          p = r.get("product") or {}
          lines = ["**Broker** — order processed. No human was involved.", ""]
          # Before the answer, never after it: a caveat under a quote is a
          # caveat most readers never reach.
          if p and not p.get("answers_question", True):
              lines += [
                  "> [!WARNING]",
                  "> **This answer is a recorded demonstration.** No model is wired, so the "
                  "pipeline responded to its fixed demo question rather than to the one you "
                  "asked. The mechanism, the money and the decisions below are real; the "
                  "answer is not an answer to your order.",
                  "",
              ]
          if d:
              lines += [
                  f"> {d.get('answer','')}",
                  "",
                  f"`sourced_from: {d.get('sourced_from')}` · "
                  f"`price: ${d.get('price_usd')}` · `cogs: ${d.get('cogs_usd')}` · "
                  f"`margin: ${d.get('margin_usd')}`",
              ]
          else:
              why = r.get("error") or "refused before anything was spent; see the decisions below"
              lines.append(f"The order was not fulfilled: `{why}`")
          # The before/after is the deliverable's evidence, not a footnote: it is
          # what the customer paid for and what the event's rules ask us to show.
          if p:
              lines += ["", "<details><summary>What the human input changed</summary>", ""]
              lines += [
                  f"**Before** — the agent alone, confidence "
                  f"{float(p.get('before_confidence', 0)):.2f}:",
                  "",
                  f"> {p.get('before','')}",
                  "",
                  "**After** — once it bought judgement:" if p.get("changed")
                  else "**After** — unchanged; the purchase confirmed the draft:",
                  "",
                  f"> {p.get('after','')}",
              ]
              if p.get("evidence"):
                  lines += ["", "What the panel said:", ""]
                  lines += [f"- {e}" for e in p["evidence"]]
              if p.get("disclosures"):
                  lines += ["", "_" + " · ".join(p["disclosures"]) + "_"]
              lines += ["", "</details>"]
          if r.get("decisions"):
              lines += ["", "<details><summary>Decisions</summary>", ""]
              for x in r["decisions"]:
                  lines.append(
                      f"- **{x['chose']}** ({x['stage']}) — {x['because']} "
                      f"_rejected: {', '.join(x['rejected'])}_ · ${x['cost_usd']}"
                  )
              lines += ["", "</details>"]
          if r.get("incidents"):
              lines += ["", "<details><summary>Incidents</summary>", ""]
              for x in r["incidents"]:
                  lines.append(f"- **{x['category']}** ({x['stage']}) — {x['detail']} → {x['recovery']}")
              lines += ["", "</details>"]
          # Outbound, in the only channel the customer opted into: the thread
          # they opened. The market stage decided this, and it is the whole of
          # the company's marketing surface.
          o = r.get("offer") or {}
          if o:
              lines += [
                  "",
                  "---",
                  "",
                  f"**{o.get('headline','')}**",
                  "",
                  o.get("proof", ""),
                  "",
                  f"_Next order: reply here with a fenced JSON work order. "
                  f"${o.get('price_usd')} a verdict._",
              ]

          req = urllib.request.Request(
              "https://api.github.com/repos/${{ github.repository }}/issues/"
              "${{ github.event.issue.number }}/comments",
              data=json.dumps({"body": "\n".join(lines)}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "User-Agent": "broker",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              print("replied:", resp.status)

          # An order that has been answered is finished. Leaving it open reads
          # as an unhandled customer, which is the opposite of what the thread
          # demonstrates. The comment above is the closing record; a fulfilled
          # order closes as completed, a refused one as not planned.
          state_reason = "completed" if d else "not_planned"
          close = urllib.request.Request(
              "https://api.github.com/repos/${{ github.repository }}/issues/"
              "${{ github.event.issue.number }}",
              data=json.dumps({"state": "closed", "state_reason": state_reason}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "User-Agent": "broker",
              },
              method="PATCH",
          )
          with urllib.request.urlopen(close, timeout=20) as resp:
              print(f"closed as {state_reason}:", resp.status)
          PY
