name: ci

# The company gates its own merges. This is evidence for the governance claim in
# README.md, not decoration: a pull request that fails here cannot be merged.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Sync
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Replay must work offline
        # The demo fallback is only real if it runs on a clean checkout with no
        # network access to any service and no API keys present.
        run: uv run company --replay demo
