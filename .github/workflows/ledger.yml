name: ledger

# Polls Stripe and republishes the dashboard. This is the server side the static
# page cannot have: the restricted key is a repository secret and only aggregate
# figures reach gh-pages. Terac exposes no webhooks either, so polling is the
# only mechanism available for both feeds.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ledger
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Poll Stripe
        env:
          # Restricted key: Balance=Read, Charges=Read. Never an sk_ key.
          STRIPE_RESTRICTED_KEY: ${{ secrets.STRIPE_RESTRICTED_KEY }}
          # Real money committed to humans via Terac, so the published margin is
          # revenue minus real spend rather than revenue minus zero. Two studies
          # at $9.00 each: 4 participants at the $4.50 CPI Terac quoted.
          COGS_COMMITTED_USD: "18.00"
        # The poller degrades rather than failing, so a Stripe outage cannot
        # take the published page down.
        run: python3 scripts/poll_ledger.py

      - name: Commit the ledger
        # Committing to main is what republishes: pages.yml runs on push to main
        # and redeploys the site. One publish path, not two.
        run: |
          git config user.name "broker-bot"
          git config user.email "broker-bot@users.noreply.github.com"
          git add runs/ledger.json runs/demo/index.json
          git diff --staged --quiet || git commit -m "chore(ledger): refresh"
          git push origin HEAD:main

      # A push made with the default GITHUB_TOKEN does not trigger another
      # workflow, so the ledger publishes the site itself rather than relying
      # on pages.yml noticing the commit.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          mkdir -p _site/runs
          cp -r runs/. _site/runs/ 2>/dev/null || true
          touch _site/.nojekyll
          test -f _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
