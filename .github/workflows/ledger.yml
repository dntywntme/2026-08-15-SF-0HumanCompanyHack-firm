name: ledger

# Polls Stripe and republishes the dashboard. This is the server side the static
# page cannot have: the restricted key is a repository secret and only aggregate
# figures reach gh-pages. Terac exposes no webhooks either, so polling is the
# only mechanism available for both feeds.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ledger
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Poll Stripe
        env:
          # Restricted key: Balance=Read, Charges=Read. Never an sk_ key.
          STRIPE_RESTRICTED_KEY: ${{ secrets.STRIPE_RESTRICTED_KEY }}
        # The poller degrades rather than failing, so a Stripe outage cannot
        # take the published page down.
        run: python3 scripts/poll_ledger.py

      - name: Commit the ledger
        # Committing to main is what republishes: pages.yml runs on push to main
        # and redeploys the site. One publish path, not two.
        run: |
          git config user.name "broker-bot"
          git config user.email "broker-bot@users.noreply.github.com"
          git add runs/ledger.json
          git diff --staged --quiet || git commit -m "chore(ledger): refresh"
          git push origin HEAD:main
