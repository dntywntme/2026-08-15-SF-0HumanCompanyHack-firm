name: ledger

# Polls Stripe and republishes the dashboard. This is the server side the static
# page cannot have: the restricted key is a repository secret and only aggregate
# figures reach gh-pages. Terac exposes no webhooks either, so polling is the
# only mechanism available for both feeds.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ledger
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Poll Stripe
        env:
          # Restricted key: Balance=Read, Charges=Read. Never an sk_ key.
          STRIPE_RESTRICTED_KEY: ${{ secrets.STRIPE_RESTRICTED_KEY }}
        # The poller degrades rather than failing, so a Stripe outage cannot
        # take the published page down.
        run: python3 scripts/poll_ledger.py

      - name: Publish to gh-pages
        run: |
          mkdir -p _site
          cp -r web/. _site/
          mkdir -p _site/runs
          cp -r runs/. _site/runs/ 2>/dev/null || true
          touch _site/.nojekyll
          test -f _site/index.html

          git config user.name "broker-bot"
          git config user.email "broker-bot@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages
          find . -maxdepth 1 -mindepth 1 -not -name '.git' -not -name '_site' -exec rm -rf {} +
          cp -r _site/. .
          rm -rf _site
          git add -A
          git diff --staged --quiet || git commit -m "chore(ledger): republish dashboard"
          git push origin gh-pages
