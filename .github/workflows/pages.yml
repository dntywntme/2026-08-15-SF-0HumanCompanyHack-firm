name: pages

# Publishes the dashboard. The site is deliberately static: it reads committed
# run checkpoints, so the deployed page and `make replay` render the same
# artifact and neither needs a secret. Any credential (Stripe restricted key,
# Terac key) stays server-side and only ever writes runs/ledger.json.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble site
        # web/ is the shell; runs/ carries the checkpoints it renders.
        run: |
          mkdir -p _site
          cp -r web/. _site/
          mkdir -p _site/runs
          cp -r runs/. _site/runs/ 2>/dev/null || true
          test -f _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
